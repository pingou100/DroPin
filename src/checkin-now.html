    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            padding-bottom: 80px;
        }
        
        .nav-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 16px;

            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        
        .nav-links {
            display: flex;
            gap: 2px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .nav-link, .export-btn {
            padding: 8px 12px;
            background: transparent;

            border-radius: 8px;

            border: none;
            cursor: pointer;

            align-items: center;

            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        
        .nav-link:hover, .export-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #1d1d1f;
        }
        
        .nav-link.active {
            background: rgba(0, 122, 255, 0.08);
            color: #007aff;
        }
        
        .nav-icon {
            font-size: 15px;
            line-height: 1;
        }

        }
        
        .export-btn:hover {
            background: rgba(0, 122, 255, 0.06);
        }
        
        .container {
            max-width: 600px;
            margin: 70px auto 20px;
            padding: 0 20px;
        }
        
        .loading {
            background: white;
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;

            border-top: 3px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;

        @keyframes spin {

        .loading p {

            font-size: 14px;
        }
        
        .venue-list {

        .venue-list.show {

        }
        
        .venue-item {

            position: relative;

        .venue-item:hover {

        }

        .venue-address {

            line-height: 1.4;

        .venue-distance {

        h2 {

            color: #1d1d1f;
            margin-bottom: 20px;

        .selected-venue-info {

            color: #8e8e93;

        }
        
        .form-group {

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;

        input[type="datetime-local"],

        }

        }

        }

            box-shadow: 0 4px 16px rgba(52, 199, 89, 0.3);

            transition: opacity 0.2s, transform 0.2s;

        .success-toast.show {

        .error-message {

            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .error-icon {
            font-size: 48px;

        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;

            letter-spacing: -0.3px;
        }
        
        .error-text {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .search-container {
            margin-bottom: 20px;
        }
        
        .search-box {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5e7;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #007aff;
        }
        
        .search-btn {
            width: 100%;
            padding: 12px 16px;
            background: #007aff;

            font-size: 16px;

        .search-btn:active {

        .back-btn {

            background: #f5f5f7;

            border: none;
            border-radius: 12px;
            font-size: 14px;

        .search-toggle-btn.show {

        .search-toggle-btn:active {

    <div class="success-toast" id="successToast">

    <div class="container">
        <button class="search-toggle-btn" id="searchToggleBtn">

        <div id="loadingView" class="loading">

        </div>
        
        <div id="searchView" class="search-container" style="display: none;">

                <input type="text" 
                       id="searchInput"

    <script type="module">
        import StorageAdapter from './js/storage/StorageAdapter.js';
        const storage = new StorageAdapter();
        console.log('[CheckinNow] Storage initialized');

        storage.initialize().then(() => {
            console.log('[CheckinNow] Storage backend initialized');
        }).catch(err => {
            console.warn('[CheckinNow] Storage init warning:', err);
        });
        
        const API_KEY = CONFIG.GOOGLE_MAPS_API_KEY;
        let currentLocation = null;
        let selectedVenue = null;
        let allVenues = [];
        
        const RELEVANT_TYPES = [
            'restaurant', 'cafe', 'bar', 'food', 'meal_takeaway', 'meal_delivery',
            'bakery', 'coffee_shop', 'fast_food_restaurant',
            'lodging', 'hotel', 'hostel', 'resort_hotel',
            'tourist_attraction', 'museum', 'art_gallery', 'aquarium', 'zoo',
            'amusement_park', 'bowling_alley', 'casino', 'movie_theater',
            'night_club', 'park', 'stadium', 'gym', 'spa', 'shopping_mall', 'store',
            'beach', 'campground', 'hiking_area', 'national_park'
        ];
        
        window.addEventListener('load', () => {
            getNearbyPlaces();
        });
        
        async function getNearbyPlaces() {
            if (!navigator.geolocation) {
                showError('Location not supported', 'Your device doesn\'t support location services.');
                return;
            }
            
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        (error) => { console.error('Geolocation error:', error); reject(error); },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                });
                
                currentLocation = { latitude: position.coords.latitude, longitude: position.coords.longitude };
                
                let venues = await searchNearby(100);
                if (venues.length < 5) venues = await searchNearby(500);
                if (venues.length < 10) venues = await searchNearby(1000);
                
                if (venues.length === 0) {
                    showError('No places found', 'No relevant venues found nearby. Redirecting to manual check-in...');
                    setTimeout(() => { window.location.href = 'add-checkin.html'; }, 3000);
                    return;
                }
                
                displayVenueList(venues);
                
            } catch (error) {
                console.error('Location error:', error);
                let errorMessage = 'Please enable location access in your browser settings. Redirecting to manual check-in...';
                if (error.code === 1) errorMessage = 'Location permission denied. Please enable location access. Redirecting...';
                else if (error.code === 2) errorMessage = 'Location unavailable. Please check your device settings. Redirecting...';
                else if (error.code === 3) errorMessage = 'Location request timed out. Please try again or use manual check-in...';
                showError('Location access needed', errorMessage);
                setTimeout(() => { window.location.href = 'add-checkin.html'; }, 4000);
            }
        }
        
        async function searchNearby(radiusMeters) {
            try {
                const response = await fetch('https://places.googleapis.com/v1/places:searchNearby', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Goog-Api-Key': API_KEY,
                        'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location,places.id,places.types,places.addressComponents'
                    },
                    body: JSON.stringify({
                        locationRestriction: { circle: { center: { latitude: currentLocation.latitude, longitude: currentLocation.longitude }, radius: radiusMeters } },
                        maxResultCount: 20
                    })
                });
                
                const data = await response.json();
                if (data.places) {
                    const filteredPlaces = data.places.filter(place => place.types && place.types.some(type => RELEVANT_TYPES.includes(type)));
                    return filteredPlaces.map(place => ({ ...place, distance: calculateDistance(currentLocation.latitude, currentLocation.longitude, place.location.latitude, place.location.longitude) })).sort((a, b) => a.distance - b.distance);
                }
                return [];
            } catch (error) { console.error('Search error:', error); return []; }
        }
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        
        function displayVenueList(venues) {
            allVenues = venues;
            const container = document.getElementById('venueList');
            container.innerHTML = '';
            venues.forEach(venue => {
                const item = document.createElement('div');
                item.className = 'venue-item';
                const name = document.createElement('div'); name.className = 'venue-name'; name.textContent = venue.displayName?.text || 'Unknown';
                const address = document.createElement('div'); address.className = 'venue-address'; address.textContent = venue.formattedAddress || '';
                const distance = document.createElement('div'); distance.className = 'venue-distance';
                distance.textContent = venue.distance < 1000 ? `${venue.distance}m away` : `${(venue.distance/1000).toFixed(1)}km away`;
                const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(venue.displayName?.text || 'venue')}/@${venue.location?.latitude||0},${venue.location?.longitude||0},17z`;
                const mapsLink = document.createElement('a'); mapsLink.href = mapsUrl; mapsLink.target = '_blank'; mapsLink.textContent = '🗺️ View on Maps';
                mapsLink.style.cssText = 'display:inline-block;margin-top:6px;padding:4px 8px;background:#34c759;color:white;text-decoration:none;font-size:12px;border-radius:6px;font-weight:500;';
                mapsLink.onclick = (e) => e.stopPropagation();
                item.appendChild(name); item.appendChild(address); item.appendChild(distance); item.appendChild(mapsLink);
                item.addEventListener('click', () => selectVenue(venue));
                container.appendChild(item);
            });
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('searchToggleBtn').classList.add('show');
            container.classList.add('show');
        }
        
        function selectVenue(venue) {
            selectedVenue = parseVenue(venue);
            document.getElementById('venueList').classList.remove('show');
            document.getElementById('searchView').style.display = 'none';
            document.getElementById('searchToggleBtn').classList.remove('show');
            document.getElementById('formVenueName').textContent = selectedVenue.venue_name;
            document.getElementById('formVenueAddress').textContent = selectedVenue.full_address;
            const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('checkinDate').value = now.toISOString().slice(0, 16);
            document.getElementById('checkinForm').classList.add('show');
        }
        
        function parseVenue(place) {
            const ac = {};
            if (place.addressComponents) place.addressComponents.forEach(c => c.types.forEach(t => ac[t] = c.longText || c.shortText));
            let venueType = 'Other';
            if (place.types) {
                if (place.types.includes('restaurant') || place.types.includes('food')) venueType = 'Restaurant';
                else if (place.types.includes('lodging')) venueType = 'Hotel';
                else if (place.types.includes('bar') || place.types.includes('night_club')) venueType = 'Bar/Pub';
                else if (place.types.includes('museum') || place.types.includes('art_gallery')) venueType = 'Cultural';
                else if (place.types.includes('park')) venueType = 'Outdoor';
                else if (place.types.includes('store') || place.types.includes('shopping_mall')) venueType = 'Shopping';
            }
            return {
                venue_name: place.displayName?.text || 'Unknown',
                latitude: place.location?.latitude || 0, longitude: place.location?.longitude || 0,
                street_address: `${ac.street_number||''} ${ac.route||''}`.trim(),
                city: ac.locality || ac.postal_town || '', state: ac.administrative_area_level_1 || '',
                postal_code: ac.postal_code || '', country: ac.country || '',
                country_code: (ac.country_code || '').toUpperCase(),
                full_address: place.formattedAddress || '', venue_type: venueType, venue_id: place.id || ''
            };
        }
        
        window.goBackToList = function() {
            document.getElementById('checkinForm').classList.remove('show');
            document.getElementById('venueList').classList.add('show');
            document.getElementById('searchToggleBtn').classList.add('show');
            document.getElementById('notes').value = '';
            selectedVenue = null;
        };
        
        document.getElementById('saveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const checkin = {
                ...selectedVenue,
                checkin_id: 'new_' + Date.now(),
                date: document.getElementById('checkinDate').value.split('T')[0],
                time: document.getElementById('checkinDate').value.split('T')[1] + ':00',
                year: parseInt(document.getElementById('checkinDate').value.split('-')[0]),
                month: parseInt(document.getElementById('checkinDate').value.split('-')[1]),
                notes: document.getElementById('notes').value,
                is_private: true, foursquare_url: '', created_date: new Date().toISOString()
            };
            await storage.addCheckin(checkin);
            const toast = document.getElementById('successToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
            document.getElementById('notes').value = '';
            setTimeout(() => goBackToList(), 2000);
        });
        
        function showError(title, message) {
            document.getElementById('loadingView').innerHTML = `<div class="error-message"><div class="error-icon">⚠️</div><div class="error-title">${title}</div><div class="error-text">${message}</div><a href="add-checkin.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;padding:13px 24px;">Manual Check-in</a></div>`;
        }
        
        function showSearchView() {
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('venueList').classList.remove('show');
            document.getElementById('searchToggleBtn').classList.remove('show');
            document.getElementById('searchView').style.display = 'block';
            setTimeout(() => document.getElementById('searchInput').focus(), 100);
        }
        
        function backToNearby() {
            document.getElementById('searchView').style.display = 'none';
            document.getElementById('loadingView').style.display = 'block';
            document.getElementById('searchToggleBtn').classList.remove('show');
            getNearbyPlaces();
        }
        
        async function performGlobalSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) { alert('Please enter a search term'); return; }
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '<div style="text-align:center;padding:60px 20px;"><div style="width:40px;height:40px;border:3px solid #e5e5e7;border-top-color:#007aff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div><p style="color:#8e8e93;font-size:14px;">Searching worldwide...</p></div>';
            try {
                const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': API_KEY, 'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location,places.id,places.types,places.addressComponents' },
                    body: JSON.stringify({ textQuery: query, maxResultCount: 20 })
                });
                const data = await response.json();
                if (data.places && data.places.length > 0) {
                    const placesWithDistance = data.places.map(place => ({ ...place, distance: calculateDistance(currentLocation.latitude, currentLocation.longitude, place.location.latitude, place.location.longitude) }));
                    placesWithDistance.sort((a, b) => a.distance - b.distance);
                    displaySearchResults(placesWithDistance);
                } else {
                    searchResults.innerHTML = '<div style="background:white;border-radius:16px;padding:32px 24px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🔍</div><div style="font-size:18px;font-weight:600;color:#1d1d1f;margin-bottom:8px;">No results found</div><div style="font-size:14px;color:#8e8e93;">Try a different search term</div></div>';
                }
            } catch (error) {
                console.error('Search error:', error);
                searchResults.innerHTML = '<div style="background:white;border-radius:16px;padding:32px 24px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">⚠️</div><div style="font-size:18px;font-weight:600;color:#1d1d1f;margin-bottom:8px;">Search failed</div><div style="font-size:14px;color:#8e8e93;">Please try again</div></div>';
            }
        }
        
        function displaySearchResults(places) {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';
            searchResults.classList.add('show');
            places.forEach(venue => {
                const item = document.createElement('div'); item.className = 'venue-item';
                const name = document.createElement('div'); name.className = 'venue-name'; name.textContent = venue.displayName?.text || 'Unknown';
                const address = document.createElement('div'); address.className = 'venue-address'; address.textContent = venue.formattedAddress || '';
                const distance = document.createElement('div'); distance.className = 'venue-distance';
                distance.textContent = venue.distance < 1000 ? `${venue.distance}m away` : venue.distance < 100000 ? `${(venue.distance/1000).toFixed(1)}km away` : `${Math.round(venue.distance/1000)}km away`;
                item.appendChild(name); item.appendChild(address); item.appendChild(distance);
                item.addEventListener('click', () => selectVenue(venue));
                searchResults.appendChild(item);
            });
        }
        
        window.addEventListener('load', () => {
            const searchToggleBtn = document.getElementById('searchToggleBtn');
            searchToggleBtn.addEventListener('click', showSearchView);
            searchToggleBtn.addEventListener('touchend', (e) => { e.preventDefault(); showSearchView(); });
            const searchBtn = document.getElementById('searchBtn');
            searchBtn.addEventListener('click', performGlobalSearch);
            searchBtn.addEventListener('touchend', (e) => { e.preventDefault(); performGlobalSearch(); });
            const backBtn = document.getElementById('backBtn');
            backBtn.addEventListener('click', backToNearby);
            backBtn.addEventListener('touchend', (e) => { e.preventDefault(); backToNearby(); });
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); performGlobalSearch(); } });
        });
        
    </script>
</body>
</html>
